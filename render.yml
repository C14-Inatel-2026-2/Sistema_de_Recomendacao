services:
  - type: web
    name: recsys-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd bend/src && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: recsys-front
    runtime: static
    rootDir: fend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: "off"
    envVars:
      - key: VITE_API_URL
        sync: false
